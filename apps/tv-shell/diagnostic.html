<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Diagnostic</title>
<link rel="stylesheet" href="styles.css">
<style>.page{padding:var(--marge-sure);display:flex;flex-direction:column;gap:var(--e3)}
 dl{display:grid;grid-template-columns:auto 1fr;gap:var(--e1) var(--e4);font-size:2.3vh}
 dt{color:var(--texte-doux);font-weight:600}dd{font-weight:700}</style></head>
<body><div class="page">
 <h1 class="marque">Diagnostic</h1>
 <dl id="d"></dl>
 <p class="aide" style="padding:0"><kbd>←</kbd> Retour à l'accueil</p>
</div>
<script>
 const l={'Résolution':`${screen.width} × ${screen.height}`,
   'Pixels par point':devicePixelRatio,'Réseau':navigator.onLine?'connecté':'hors ligne',
   'Contexte sécurisé':isSecureContext?'oui':'non','Langue':navigator.language,
   'Cœurs logiques':navigator.hardwareConcurrency,'Adresse':location.origin};
 d.innerHTML=Object.entries(l).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');
 addEventListener('keydown',e=>{if(e.key==='Backspace'||e.key==='ArrowLeft')history.back();});
</script></body></html>
